openapi: 3.0.3
info:
  title: Time Deposit API
  version: 5.0.0
  description: >-
    Retrieves deposits and starts background jobs applying the existing interest calculator.
    Rates are annual percentages divided by twelve. Only interest is rounded to
    two decimal places using BigDecimal.valueOf of the double interest and HALF_UP.
    The resulting interest is added to the balance without final-balance rounding.
servers:
  - url: http://localhost:8080
paths:
  /time-deposits:
    get:
      operationId: retrieveTimeDeposits
      summary: Retrieve a page of time deposits, including their withdrawals
      parameters:
        - name: page
          in: query
          description: Zero-based page number; deposits are ordered by ID
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          description: Number of deposits per page
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 20
      responses:
        '200':
          description: A page of deposits ordered by ID, with pagination metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeDepositPage'
  /time-deposits/balance-updates:
    post:
      operationId: updateTimeDepositBalances
      summary: Start a background job applying monthly interest to every deposit
      description: >-
        Returns immediately with a UUID identifying an accepted background execution
        (202 STARTED), or the existing active execution (409 RUNNING). Database-backed
        admission allows only one queued or running execution across application instances.
        Busy requests do not enqueue work or create execution-log rows. After completion
        or failure, another POST starts a new execution; POST is not completion polling.
        The internal execution log has no query endpoint: the kata requires exactly two
        business endpoints and execution-history management is outside its scope.
        Each completed execution applies one interest credit at each deposit's current age,
        using the original calculator's annual rate divided by twelve. Repeated
        successful requests credit eligible deposits again, even at the same age.
        There is no missed-period catch-up. Basic/Student eligibility starts on day
        31 and Premium on day 46; Student stops after day 365. Unknown plans earn
        no interest. Days and withdrawals are not changed. All groups commit in one
        worker-thread transaction; an optimistic-lock conflict or processing failure rolls
        back all balance changes and records FAILED in the execution log. COMPLETED is
        recorded after commit. A 202 response acknowledges acceptance, not completion.
        A GET during execution may still show the previously committed balances.
      responses:
        '202':
          description: A new background execution was accepted; balances may not be updated yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceUpdateJob'
              example:
                jobId: 'a39bbdbe-5aa4-4ccc-99c9-08f0f67b4b1d'
                status: STARTED
                message: Balance update job accepted.
        '409':
          description: An execution is already queued or running; no additional execution was started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceUpdateJob'
              example:
                jobId: 'a39bbdbe-5aa4-4ccc-99c9-08f0f67b4b1d'
                status: RUNNING
                message: A balance update job is already running.
components:
  schemas:
    BalanceUpdateJob:
      type: object
      additionalProperties: false
      required: [jobId, status, message]
      properties:
        jobId:
          type: string
          format: uuid
          description: UUID of the newly accepted or already-active execution
        status:
          type: string
          enum: [STARTED, RUNNING]
          description: STARTED acknowledges acceptance; RUNNING includes queued work
        message:
          type: string
    TimeDepositPage:
      type: object
      additionalProperties: false
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TimeDeposit'
        page:
          type: integer
          format: int32
          example: 0
        size:
          type: integer
          format: int32
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 42
        totalPages:
          type: integer
          format: int64
          example: 3
    TimeDeposit:
      type: object
      additionalProperties: false
      required: [id, planType, balance, days, withdrawals]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        planType:
          type: string
          description: Exact stored plan name; unknown names are preserved
          example: basic
        balance:
          type: number
          format: double
          example: 1000.83
        days:
          type: integer
          format: int32
          example: 31
        withdrawals:
          type: array
          items:
            $ref: '#/components/schemas/Withdrawal'
    Withdrawal:
      type: object
      additionalProperties: false
      required: [id, amount, date]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        amount:
          type: number
          example: 12.34
        date:
          type: string
          format: date
          example: '2026-01-02'
