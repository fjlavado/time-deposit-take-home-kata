spring:
  application:
    name: time-deposit-kata
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/time_deposits}
    username: ${DB_USERNAME:time_deposit}
    password: ${DB_PASSWORD:time_deposit}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
server:
  port: ${PORT:8080}
