name: time-deposit-performance
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: time_deposits_perf
      POSTGRES_USER: time_deposit
      POSTGRES_PASSWORD: time_deposit
    ports:
      - "127.0.0.1:${PERF_DB_PORT:-5433}:5432"
    volumes:
      - performance-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U time_deposit -d time_deposits_perf"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  performance-data:
